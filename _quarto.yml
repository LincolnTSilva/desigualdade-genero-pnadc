project:
  type: website
  # Só as páginas .qmd viram site (deixa de fora arquivos de apoio)
  render:
    - "*.qmd"
  # Copia o relatório .qmd para downloads/, para o link de download do relatório
  post-render: _copia-downloads.R

# Os cálculos rodam só na sua máquina; o site publica os resultados guardados
execute:
  freeze: auto

website:
  title: "Gênero e PNAD Contínua em R"
  description: "Minicurso sobre indicadores de desigualdade de gênero com os microdados da PNAD Contínua em R."
  site-url: "https://lincolntsilva.github.io/desigualdade-genero-pnadc/"
  repo-url: "https://github.com/LincolnTSilva/desigualdade-genero-pnadc"
  search: true
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    left:
      - href: index.qmd
        text: Início
      - href: preparacao.qmd
        text: Preparação
      - text: Programa
        menu:
          - href: dia1.qmd
            text: "Dia 1: da pergunta aos dados"
          - href: dia2.qmd
            text: "Dia 2: dos dados às conclusões"
          - href: relatorio.qmd
            text: "Relatório"
      - href: materiais.qmd
        text: Materiais
      - href: dados.qmd
        text: Dados
      - href: referencias.qmd
        text: Referências
      - href: about.qmd
        text: Sobre
    right:
      - icon: github
        href: https://github.com/LincolnTSilva/desigualdade-genero-pnadc
        aria-label: Repositório no GitHub

  page-footer:
    left: "Minicurso interno · 2026"
    right: "Feito com [Quarto](https://quarto.org)"

format:
  html:
    lang: pt
    theme:
      - cosmo
      - tema.scss
    css: styles.css
    toc: true
    toc-title: "Nesta página"
